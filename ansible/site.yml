---
- name: Prepare all Kubernetes nodes
  hosts: k8s
  become: true
  roles:
    - common
    - containerd
    - kube_packages

- name: Initialise the first control-plane node and install networking
  hosts: control_plane[0]
  become: true
  roles:
    - control_plane
    - calico

- name: Create join credentials on the first control plane
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Print a fresh join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Upload control-plane certificates and capture the certificate key
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      register: upload_certs
      changed_when: false

- name: Join the additional control-plane nodes, one at a time
  hosts: control_plane[1:]
  become: true
  serial: 1
  roles:
    - cp_join

- name: Join the worker nodes
  hosts: workers
  become: true
  roles:
    - worker
