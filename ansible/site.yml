---
- name: Prepare all Kubernetes nodes
  hosts: k8s
  become: true
  roles:
    - common
    - containerd
    - kube_packages

- name: Initialise the first control-plane node and install networking
  hosts: control_plane[0]
  become: true
  roles:
    - control_plane
    - calico

- name: Create a join command on the control plane
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Print a fresh join command (token valid for 24 hours)
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

- name: Join the worker nodes
  hosts: workers
  become: true
  roles:
    - worker
